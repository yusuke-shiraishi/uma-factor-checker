<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウマ娘 ガチ勢向け因子チェッカー（OCR搭載版）</title>
  <!-- ★完全無料の画像認識AI「Tesseract.js」を読み込む魔法の1行 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; padding: 12px; margin: 0; color: #333; }
    .container { background: #fff; padding: 15px; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { font-size: 1.2rem; color: #333; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; }
    
    .section { margin-bottom: 20px; padding: 12px; border-radius: 8px; }
    .section-1 { background: #e3f2fd; border: 1px solid #bbdefb; }
    .section-2 { background: #e8f5e9; border: 1px solid #c8e6c9; }
    .section-3 { background: #fce4ec; border: 1px solid #f8bbd0; }

    .section-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 6px; display: flex; flex-direction: column;}
    .note { font-size: 0.75rem; color: #555; font-weight: normal; margin-top: 2px; margin-bottom: 8px;}
    
    .skill-group { display: flex; flex-wrap: wrap; gap: 6px; max-height: 200px; overflow-y: auto; padding: 8px; background: rgba(255,255,255,0.6); border-radius: 6px; border: 1px solid rgba(0,0,0,0.1); }
    label { background: #fff; padding: 6px 10px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; border: 1px solid #ccc; display: flex; align-items: center; user-select: none; transition: 0.15s; }
    input[type="checkbox"] { margin-right: 4px; transform: scale(1.1); }
    
    .section-1 label:has(input:checked) { background: #1976d2; color: #fff; border-color: #1976d2; font-weight: bold; }
    .section-2 label:has(input:checked) { background: #388e3c; color: #fff; border-color: #388e3c; font-weight: bold; }
    .section-3 label:has(input:checked) { background: #d32f2f; color: #fff; border-color: #d32f2f; font-weight: bold; }

    /* AIアップロード部分のデザイン */
    .ocr-box { background: #fff3e0; border: 2px dashed #ff9800; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
    .ocr-box input[type="file"] { display: none; }
    .upload-btn { background: #ff9800; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; display: inline-block; margin-bottom: 10px; box-shadow: 0 3px #e65100;}
    .upload-btn:active { transform: translateY(3px); box-shadow: 0 0 #e65100; }
    #ocr-status { font-size: 0.85rem; font-weight: bold; color: #e65100; }

    #result { margin-top: 10px; padding: 15px; background: #fffde7; border-radius: 8px; border: 2px solid #fbc02d; }
    .result-item { margin-bottom: 12px; }
    .r-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 4px; }
    .r-data { font-size: 0.95rem; color: #222; font-weight: bold; line-height: 1.4; }
    .r-miss { color: #d32f2f; }
    .r-hit { color: #1976d2; }
    .r-extra { color: #f57f17; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐎 因子チェッカー（OCR搭載版）</h1>

    <div class="section section-1">
      <div class="section-title">① 今回の「必須スキル」を選ぶ</div>
      <div class="skill-group" id="target-skills" onchange="updateSupportList()"></div>
    </div>

    <div class="section section-2">
      <div class="section-title">② そのうち「サポカ」で取れるものは？</div>
      <div class="skill-group" id="support-skills" onchange="calculate()">
        <span style="font-size:0.8rem; color:#666;">※先に①を選んでください</span>
      </div>
    </div>

    <!-- ★新機能：画像読み取りエリア -->
    <div class="section section-3">
      <div class="section-title">③ 「親因子」のスキルを入力</div>
      
      <div class="ocr-box">
        <label class="upload-btn">
          📸 因子のスクショを読み込む
          <input type="file" id="image-upload" accept="image/png, image/jpeg" onchange="processImage(event)">
        </label>
        <div id="ocr-status">※手動でチェックを入れることも可能です</div>
      </div>

      <div class="skill-group" id="factor-skills" onchange="calculate()"></div>
    </div>

    <div id="result">
      <div class="result-item">
        <div class="r-title">🎯 サポカの弱点を因子でカバーできた必須枠！</div>
        <div class="r-data r-hit" id="res-hit">ここに表示されます</div>
      </div>
      <div class="result-item">
        <div class="r-title">❌ サポカにも因子にも無い必須スキル（妥協点）</div>
        <div class="r-data r-miss" id="res-miss">ここに表示されます</div>
      </div>
      <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">
      <div class="result-item">
        <div class="r-title">✨ 必須枠以外で拾えた【SPの捌け口】</div>
        <div class="r-data r-extra" id="res-extra">ここに表示されます</div>
      </div>
    </div>
  </div>

  <script>
    const masterSkills = [
      "アングリング×スキーミング", "王手", "君臨", "電光石火", "ハイボルテージ", "つぼみ、ほころぶ時", "ヴィクトリーショット！", 
      "スピードイーター", "地固め", "先手必勝", "盤石の構え", "危険回避", "ポジションセンス", "アオハル点火・賢",
      "起死回生", "迫る影", "直線一気", "抜群の切れ味", "差し切り体勢", "抜け出し準備", "あっぱれ大盤振る舞い！", "超新星爆発！",
      "マイルコーナー◯", "マイル直線◯", "中距離コーナー◯", "中距離直線◯", "長距離コーナー◯", "長距離直線◯",
      "右回り◯", "左回り◯", "秋ウマ娘◯", "冬ウマ娘◯", "道悪◯", "良バ場◯",
      "ウマ好み", "遊びはおしまいっ！", "尻尾上がり", "ペースアップ", "スリップストリーム", "直線巧者", "コーナー巧者◯", "垂れウマ回避",
      "トレセン絆シナリオ", "URAシナリオ", "アオハル杯シナリオ"
    ];

    window.onload = function() {
      const targetDiv = document.getElementById('target-skills');
      const factorDiv = document.getElementById('factor-skills');
      masterSkills.forEach(skill => {
        const checkboxHTML = `<label><input type="checkbox" value="${skill}">${skill}</label>`;
        targetDiv.innerHTML += checkboxHTML;
        factorDiv.innerHTML += checkboxHTML;
      });
    };

    function updateSupportList() {
      const targetNodes = document.querySelectorAll('#target-skills input:checked');
      const supportDiv = document.getElementById('support-skills');
      supportDiv.innerHTML = '';
      if(targetNodes.length === 0) {
        supportDiv.innerHTML = '<span style="font-size:0.8rem; color:#666;">※先に①を選んでください</span>';
      } else {
        Array.from(targetNodes).forEach(input => {
          supportDiv.innerHTML += `<label><input type="checkbox" value="${input.value}">${input.value}</label>`;
        });
      }
      calculate();
    }

    // ★画像読み取り（OCR）の魔法のコード
    async function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusText = document.getElementById('ocr-status');
      statusText.textContent = "⏳ AIが画像を解析中...（初回は数秒かかります）";
      
      try {
        // Tesseract.jsで日本語を読み取り！
        const result = await Tesseract.recognize(file, 'jpn');
        const extractedText = result.data.text.replace(/\s+/g, ""); // スペースを除去して比較しやすくする
        console.log("読み取り結果:", extractedText);

        let hitCount = 0;
        // 読み取った文字の中に、マスターリストのスキル名が含まれているかチェック
        masterSkills.forEach(skill => {
          // 「◯」などの記号揺れ対策で部分一致で探す
          const searchWord = skill.replace("◯", ""); 
          if (extractedText.includes(searchWord)) {
            // 見つかったら、③の該当チェックボックスをONにする！
            const checkbox = document.querySelector(`#factor-skills input[value="${skill}"]`);
            if (checkbox && !checkbox.checked) {
              checkbox.checked = true;
              hitCount++;
            }
          }
        });

        statusText.textContent = `✅ 解析完了！${hitCount}個のスキルを自動チェックしました！`;
        calculate(); // チェックが入ったので自動再計算

      } catch (error) {
        statusText.textContent = "❌ 解析に失敗しました。もう一度試してください。";
        console.error(error);
      }
    }

    function calculate() {
      const targets = Array.from(document.querySelectorAll('#target-skills input:checked')).map(n => n.value);
      const supports = Array.from(document.querySelectorAll('#support-skills input:checked')).map(n => n.value);
      const factors = Array.from(document.querySelectorAll('#factor-skills input:checked')).map(n => n.value);

      let missingReq = targets.filter(s => !supports.includes(s)); 
      let hitSkills = missingReq.filter(s => factors.includes(s)); 
      let stillMiss = missingReq.filter(s => !factors.includes(s)); 
      let extraSkills = factors.filter(s => !targets.includes(s)); 

      document.getElementById('res-hit').textContent = hitSkills.length > 0 ? hitSkills.join('、') : (missingReq.length === 0 ? '弱点なし！' : 'なし');
      document.getElementById('res-miss').textContent = stillMiss.length > 0 ? stillMiss.join('、') : (targets.length === 0 ? '目標を設定してください' : '完璧！(全必須スキル網羅)');
      document.getElementById('res-extra').textContent = extraSkills.length > 0 ? extraSkills.join('、') : 'なし';
    }
  </script>
</body>
</html>
